name: Daily Auto Commit

on:
  # 每天运行一次 - 北京时间 9:00（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'  # UTC 1:00 = 北京时间 9:00

  # 允许手动触发测试
  workflow_dispatch:

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置为北京时间
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: 配置 Git
        run: |
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "64867944@qq.com"

      - name: 获取当前位置天气
        id: weather
        run: |
          # 根据IP地址自动获取地理位置
          echo "🌍 正在获取当前位置..."
          LOCATION=$(curl -s "https://ipapi.co/json/")
          LAT=$(echo "$LOCATION" | jq -r '.latitude')
          LON=$(echo "$LOCATION" | jq -r '.longitude')
          CITY=$(echo "$LOCATION" | jq -r '.city')
          COUNTRY=$(echo "$LOCATION" | jq -r '.country_name')

          echo "📍 位置: $CITY, $COUNTRY (纬度: $LAT, 经度: $LON)"

          # 获取天气数据
          DATA=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&current=temperature_2m,weathercode&timezone=auto")
          TEMP=$(echo "$DATA" | jq '.current.temperature_2m')
          CODE=$(echo "$DATA" | jq '.current.weathercode')

          case $CODE in
            0) DESC="☀️ 晴天" ;;
            1|2|3) DESC="⛅ 多云" ;;
            45|48) DESC="🌫️ 雾霾" ;;
            51|53|55|61|63|65) DESC="🌦️ 小雨" ;;
            80|81|82) DESC="🌧️ 阵雨" ;;
            95|96|99) DESC="⛈️ 雷暴" ;;
            *) DESC="🌈 未知天气" ;;
          esac

          echo "weather_desc=$DESC" >> $GITHUB_OUTPUT
          echo "weather_temp=$TEMP°C" >> $GITHUB_OUTPUT
          echo "weather_location=$CITY, $COUNTRY" >> $GITHUB_OUTPUT

      - name: 执行每日提交任务
        run: |
          echo "======================================"
          echo "开始每日自动提交任务"
          echo "日期: $(date '+%Y-%m-%d')"
          echo "======================================"
          echo ""

          # 随机确定今天提交的次数（1-10次）
          NUM_COMMITS=$((RANDOM % 10 + 1))
          echo "📝 今天计划提交次数: $NUM_COMMITS"
          echo ""

          # 励志语数组
          MSGS=(
            "🌟 Keep going, everything you need will come to you."
            "💪 Believe in yourself!"
            "🚀 Push your limits!"
            "🔥 Focus and win."
            "🍀 Good things take time."
            "🐱 Stay curious."
            "🧠 Learn something new today."
            "✨ You are unstoppable."
            "💯 Progress, not perfection."
            "🎯 Stay focused and never give up."
          )

          # 提交信息数组
          COMMIT_MSGS=(
            "Update code"
            "Fix bug"
            "Add feature"
            "Improve performance"
            "Refactor code"
            "Update documentation"
            "Fix typo"
            "Add comments"
            "Optimize code"
            "Clean up code"
          )

          # 创建 log.txt（如果不存在）
          if [ ! -f "log.txt" ]; then
            echo "# Auto Commit Log" > log.txt
            echo "Started on: $(date '+%Y-%m-%d %H:%M:%S')" >> log.txt
            echo "========================================" >> log.txt
            echo "" >> log.txt
          fi

          # 执行提交
          SUCCESS_COUNT=0

          for i in $(seq 1 $NUM_COMMITS); do
            echo "[$i/$NUM_COMMITS] 准备提交..."

            # 随机选择提交信息和励志语
            COMMIT_MSG="${COMMIT_MSGS[$RANDOM % ${#COMMIT_MSGS[@]}]}"
            MOTIVATE_MSG="${MSGS[$RANDOM % ${#MSGS[@]}]}"

            # 生成提交内容
            TODAY=$(date '+%Y-%m-%d（%A）')
            TIME=$(date '+%H:%M:%S')
            LUNAR="农历：$(date +'%m')月$(date +'%d')日"

            # 写入日志
            echo "📅 $TODAY" >> log.txt
            echo "⏰ $TIME" >> log.txt
            echo "🗓️ $LUNAR" >> log.txt
            echo "📍 位置：${{ steps.weather.outputs.weather_location }}" >> log.txt
            echo "⛅ 天气：${{ steps.weather.outputs.weather_desc }}，${{ steps.weather.outputs.weather_temp }}" >> log.txt
            echo "$MOTIVATE_MSG" >> log.txt

            # 更新提交计数
            COUNT_FILE=".github/commit_count.txt"
            if [ -f "$COUNT_FILE" ]; then
              COUNT=$(cat $COUNT_FILE)
            else
              COUNT=0
            fi
            COUNT=$((COUNT + 1))
            echo "$COUNT" > $COUNT_FILE
            echo "🔢 第 $COUNT 次提交" >> log.txt
            echo "----------------------------------------" >> log.txt

            # Git 提交
            git add log.txt $COUNT_FILE

            if git commit -m "📅 $COMMIT_MSG - $(date '+%Y-%m-%d')"; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              echo "✅ 成功: $COMMIT_MSG"
            else
              echo "⚠️  提交失败"
            fi

            # 除了最后一次，其他提交后都等待一段随机时间（30-180秒）
            if [ $i -lt $NUM_COMMITS ]; then
              WAIT_TIME=$((RANDOM % 151 + 30))
              echo "⏳ 等待 ${WAIT_TIME} 秒后继续..."
              sleep $WAIT_TIME
            fi

            echo ""
          done

          echo "======================================"
          echo "✅ 提交任务完成!"
          echo "成功: $SUCCESS_COUNT/$NUM_COMMITS"
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "======================================"

      - name: 推送代码
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📤 正在推送到远程仓库..."
          git remote set-url origin https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ 推送完成!"
